services:
  - type: web
    name: midnight-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py ensure_panel_admin
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,midnightshop.ir,www.midnightshop.ir"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: CLEAR_CATALOG
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://midnight-shop-nine.vercel.app,https://midnight-admin-pi.vercel.app,https://midnightshop.ir,https://www.midnightshop.ir,http://localhost:3000,http://localhost:3001"
